name: Release promotion

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-promotion:
    name: release-promotion
    runs-on: ubuntu-latest
    steps:
      - name: Require dev as the exact promotion source
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: test "$HEAD_REF" = "dev"
