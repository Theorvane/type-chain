name: GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver version to tag and release (e.g. 0.1.1)
        required: true
        type: string
      confirm_release:
        description: Explicit authorization for this irreversible GitHub Release
        required: true
        type: choice
        options: [cancel, create]

permissions:
  contents: read

jobs:
  release:
    if: inputs.confirm_release == 'create'
    name: create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: main

      - name: Verify version matches package.json
        run: |
          ACTUAL="$(node -p "require('./package.json').version")"
          if [ "$ACTUAL" != "${{ inputs.version }}" ]; then
            echo "::error::version mismatch: package.json=$ACTUAL requested=${{ inputs.version }}"
            exit 1
          fi

      - name: Verify package is published on npm
        run: |
          npm view "@theorvane/type-chain@${{ inputs.version }}" version --json
          echo "npm registry confirmed: @theorvane/type-chain@${{ inputs.version }}"

      - name: Create tag
        run: |
          TAG="v${{ inputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release v${{ inputs.version }}"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --repo "${{ github.repository }}" \
            --title "v${{ inputs.version }}" \
            --generate-notes \
            --verify-tag
